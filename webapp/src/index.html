<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE Agents</title>
<base href="/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<script>
  // Applied before first paint so the correct theme renders immediately (no flash).
  (function () {
    var saved = localStorage.getItem('se_theme');
    var theme = saved || 'light';
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
</head>
<body>
<app-root></app-root>
</body>
</html>
