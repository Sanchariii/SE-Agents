server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Don't leak the nginx version in the Server header / error pages.
    server_tokens off;

    # Content-hashed build assets (index-<hash>.js, <hash>.css, images). The filename changes
    # whenever the content changes, so these are safe to cache forever. `=404` (never fall back
    # to index.html) so a purged/renamed asset returns a real 404 instead of an HTML page served
    # with a JS/CSS MIME type.
    #
    # NOTE: nginx `add_header` in a nested location REPLACES inherited headers, so the security
    # header must be repeated here alongside the cache header.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App shell + SPA fallback. `no-cache` forces the browser to revalidate index.html on every
    # load, so a freshly rebuilt bundle (which references new hashed asset filenames) is always
    # picked up — no hard refresh or manual cache/storage clearing needed.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
