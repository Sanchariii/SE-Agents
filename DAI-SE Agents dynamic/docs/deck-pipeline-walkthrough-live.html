<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a deck gets built</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8ECEF; --surface:#FFFFFF; --ink:#18232E; --muted:#5D6B78; --rule:#C3CCD4;
    --teal:#13707A; --teal-soft:#E3F2F2; --amber:#B7790C; --amber-soft:#FBF1DC; --red:#B23A30; --green:#2C7A4B; --green-soft:#E1F1E7;
    --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
    --mono:ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}

  .turns{display:flex;justify-content:center;gap:6px;padding:12px 20px 0}
  .turns button{background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-size:15px;font-weight:500;color:var(--muted);transition:background .3s,color .3s,border-color .3s}
  .turns button:hover{color:var(--ink)}
  .turns button[aria-selected="true"]{background:var(--surface);border-color:var(--rule);color:var(--ink);font-weight:600}
  .turns button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rule);color:#fff;font-size:12px;margin-right:8px;transition:background .3s}
  .turns button[aria-selected="true"] b{background:var(--teal)}

  .stage{flex:1;min-height:0;display:flex;padding:8px 20px 0}
  .stage svg{flex:1;min-height:0;width:100%;height:100%;display:block}
  .stage svg.enter{animation:enter .6s ease both}
  @keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

  .caption{height:76px;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 20px 10px}
  .caption .num{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;transition:background .3s}
  .caption .num.all{background:var(--ink);font-size:13px}
  .caption .txt{font-family:var(--serif);font-size:30px;line-height:1.1}
  .caption .txt.swap{animation:swap .5s ease both}
  @keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dots{display:flex;gap:6px;margin-left:10px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:background .3s}
  .dots i.on{background:var(--teal)}
  .dots i.past{background:var(--ink);opacity:.45}

  .controls{position:fixed;right:16px;bottom:14px;display:flex;gap:6px;opacity:.15;transition:opacity .25s}
  .controls:hover,.controls:focus-within{opacity:1}
  .controls button{background:var(--surface);border:1px solid var(--rule);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:14px}
  .controls button:hover{border-color:var(--ink)}

  svg text{font-family:var(--sans);fill:var(--ink)}
  .grp rect{fill:#F4F6F8;stroke:var(--rule);stroke-width:1;stroke-dasharray:5 4;transition:fill .4s,stroke .4s,opacity .4s}
  .grp text{font-size:13px;font-weight:600;fill:var(--muted);transition:fill .4s}
  .grp.is-active rect{fill:#EEF7F7;stroke:var(--teal)}
  .grp.is-active text{fill:var(--teal)}
  .grp.is-todo{opacity:.45}

  .node{cursor:pointer;transition:opacity .45s}
  .node .shape{fill:var(--surface);stroke:#8795A3;stroke-width:1.4;transition:fill .4s,stroke .4s,stroke-width .4s}
  .node .t{font-size:15px;font-weight:600;transition:fill .4s}
  .node .s{font-size:12.5px;fill:var(--muted)}
  .node .s.code{font-family:var(--mono);font-size:13px;fill:var(--ink)}
  .node .badge circle{fill:var(--ink);transition:fill .4s}
  .node .badge text{fill:#fff;font-size:12px;font-weight:700}
  .node.is-todo{opacity:.28}
  .node.is-done .shape{stroke:var(--ink)}
  .node.is-active .shape{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2.6}
  .node.is-active .badge circle{fill:var(--teal)}
  .node.is-active .t{fill:var(--teal)}
  .node.gate.is-active .shape{fill:var(--green-soft);stroke:var(--green)}
  .node.gate.is-active .t{fill:var(--green)}
  .node.gate.failing .shape{fill:#F8E4E1;stroke:var(--red)}
  .node.gate.failing .t{fill:var(--red)}
  .halo{fill:none;stroke:var(--teal);stroke-width:2;opacity:0}
  .node.is-active .halo{animation:halo 2.2s ease-out infinite}
  .node.gate .halo{stroke:var(--green)}
  .node.gate.failing .halo{stroke:var(--red)}
  @keyframes halo{0%{opacity:.55;stroke-width:2}100%{opacity:0;stroke-width:16}}

  /* Work-order result tiles (turn 2) */
  .node.tile .t{font-size:14px}
  .node.keep.is-active .shape{fill:#F4F6F8;stroke:#9AA6B2;stroke-width:1.4;stroke-dasharray:4 3}
  .node.keep.is-active .t{fill:var(--muted)}
  .node.keep .halo{display:none}
  .node.relayout.is-active .shape{fill:var(--amber-soft);stroke:var(--amber)}
  .node.relayout.is-active .t{fill:#8A5B07}
  .node.relayout .halo{stroke:var(--amber)}
  .node.tile.is-active .s{font-weight:600}

  /* Human-in-the-loop style questions and sliders */
  .grp.ask.is-active rect{fill:#FDF6E8;stroke:var(--amber)}
  .grp.ask.is-active text{fill:#8A5B07}
  .node.ask.is-active .shape{fill:var(--amber-soft);stroke:var(--amber)}
  .node.ask.is-active .t{fill:#8A5B07}
  .node.ask.is-active .badge circle{fill:var(--amber)}
  .node.ask .halo{stroke:var(--amber)}

  .edge path{fill:none;stroke:#8795A3;stroke-width:1.6;transition:stroke .4s,stroke-width .4s}
  .edge.evidence path{stroke:var(--amber);stroke-dasharray:6 5}
  .edge.fail path{stroke:var(--red);stroke-dasharray:6 5}
  .edge.pass path{stroke:var(--green)}
  .edge.is-active path{stroke-width:2.4}
  .edge.is-active:not(.evidence):not(.fail):not(.pass) path{stroke:var(--teal)}
  .edge.is-todo{opacity:.22}
  .edge{transition:opacity .4s}
  .edge text{font-size:12px;font-weight:600}
  .edge .lbl-bg{fill:var(--surface)}
  .edge.evidence text{fill:var(--amber)}
  .edge.fail text{fill:var(--red)}
  .edge.pass text{fill:var(--green)}
  .token{pointer-events:none}

  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
</head>
<body>

<div class="turns" role="tablist" aria-label="Conversation turn">
  <button role="tab" id="tab0" aria-selected="true"><b>1</b>First request: build the deck</button>
  <button role="tab" id="tab1" aria-selected="false"><b>2</b>Next turn: change the deck</button>
  <button role="tab" id="tab2" aria-selected="false"><b>3</b>Inside the designer: one slide</button>
</div>
<div class="stage" id="stage">

  <button id="next" aria-label="Next step">▶</button>
</div>

    {pts:[[330,915],[330,947]], to:'T3', step:5, delay:11, cls:'fail', label:{text:['still failing'], x:342, y:935, anchor:'start'}},
    {pts:[[480,985],[640,985],[640,880],[748,880]], to:'OK', step:5, delay:14},

  ],
  status:{
    1:[[1,'AD','choosing one layout per slide…'],[4,'CA','checking…'],[7,'CA','unchanged → no AI call'],[12,'CA','changed → design it']],
    2:[[1,'HI','resolved: High'],[5,'MX','brand colours + Barlow forced'],[9,'MX','sample title stripped ✓'],[13,'MX','code → guard → gate ✓']],
    3:[[1,'RV','rendering…'],[3.5,'RV','vision model judging…'],[5.5,'RV','7/10: too dense ✕'],[7,'MX','redo with critique + render…'],[13,'RV','9/10 ✓'],[15,'RV','pass: ship it']],
    4:[[1,'T1','writing DeckBuilder code…'],[3,'T1','guard: brand rules ✓'],[5,'G1','checking 1–15…'],[6,'G1','check 10 failed ✕'],[8,'T1','attempt 2 of 3…'],[12,'G1','15 of 15 passed ✓']],
    5:[[1,'T2','filling a layout plan…'],[5,'G2','checking 1–15…'],[7,'G2','15 of 15 passed ✓'],[12.5,'T3','always succeeds ✓']],
    6:[[1,'OK','gate-clean ✓'],[4,'ST','slides merged in order'],[8,'ST','High master kept on brand ✓']],
  },
};
const SCENES=[SCENE1,SCENE2,SCENE3];

/* Play order: turn 1 boxes, turn 1 overview, turn 2 boxes, turn 2 overview, repeat */
const SEQ=[];
SCENES.forEach((sc,s)=>{ for(let i=1;i<=sc.steps;i++) SEQ.push([s,i]); SEQ.push([s,0]); });

/* ===== Rendering ===== */
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('diagram');
const el=(tag,a={},p)=>{const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;};

function roundedPath(pts,r=12){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,l1/2,l2/2);
    d+=` L${x1-(x1-x0)/l1*rr},${y1-(y1-y0)/l1*rr} Q${x1},${y1} ${x1+(x2-x1)/l2*rr},${y1+(y2-y1)/l2*rr}`;
  }
  const l=pts[pts.length-1]; return d+` L${l[0]},${l[1]}`;
}
function shapeFor(n,g,cls){
  const L=n.x-n.w/2,T=n.y-n.h/2;
  if(n.shape==='diamond') return el('polygon',{class:cls,points:`${n.x},${T} ${L+n.w},${n.y} ${n.x},${T+n.h} ${L},${n.y}`},g);
  if(n.shape==='cyl'){
    const ry=9;
    el('path',{class:cls,d:`M${L},${T+ry} A${n.w/2},${ry} 0 0 1 ${L+n.w},${T+ry} V${T+n.h-ry} A${n.w/2},${ry} 0 0 1 ${L},${T+n.h-ry} Z`},g);
    if(cls==='shape') el('path',{class:'shape',d:`M${L},${T+ry} A${n.w/2},${ry} 0 0 0 ${L+n.w},${T+ry}`,style:'fill:none'},g);
    return;
  }
  return el('rect',{class:cls,x:L,y:T,width:n.w,height:n.h,rx:n.shape==='pill'?n.h/2:10},g);
}

const COLORS={ink:'#8795A3',teal:'#13707A',amber:'#B7790C',red:'#B23A30',green:'#2C7A4B'};
let SC, sceneIdx=-1, nodeEls={}, statusEls={}, groupEls={}, edgeEls=[], tokenLayer, tokenPool=[];

function buildScene(s){
  sceneIdx=s; SC=SCENES[s];
  svg.innerHTML=''; svg.setAttribute('viewBox',SC.viewBox);
  nodeEls={}; statusEls={}; groupEls={}; edgeEls=[]; tokenPool=[];
  svg.classList.remove('enter'); void svg.getBoundingClientRect(); svg.classList.add('enter');

  const defs=el('defs',{},svg);
  for(const [k,c] of Object.entries(COLORS)){
    const m=el('marker',{id:'arr-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',fill:c},m);
  }
  const gG=el('g',{},svg), gE=el('g',{},svg); tokenLayer=el('g',{},svg); const gL=el('g',{},svg), gN=el('g',{},svg);

  SC.groups.forEach(gr=>{
    const g=el('g',{class:'grp '+(gr.cls||'')},gG);
    el('rect',{x:gr.x,y:gr.y,width:gr.w,height:gr.h,rx:14},g);
    el('text',{x:gr.align==='end'?gr.x+gr.w-14:gr.x+16,y:gr.y+22,'text-anchor':gr.align==='end'?'end':'start'},g).textContent=gr.label;
    groupEls[gr.id]=g;
  });

  SC.edges.forEach(e=>{
    const g=el('g',{class:'edge '+(e.cls||'')},gE);
    const path=el('path',{d:roundedPath(e.pts)},g);
    let lg=null;
    if(e.label){
      lg=el('g',{class:'edge '+(e.cls||'')},gL);
      if(e.label.bg){const w=e.label.text[0].length*6.6+14; el('rect',{class:'lbl-bg',x:e.label.x-w/2,y:e.label.y-13,width:w,height:18,rx:4},lg);}
      e.label.text.forEach((t,i)=>el('text',{x:e.label.x,y:e.label.y+i*15,'text-anchor':e.label.anchor},lg).textContent=t);
    }
    edgeEls.push({g,lg,path,e,len:path.getTotalLength()});
  });

  SC.nodes.forEach(n=>{
    const g=el('g',{class:'node '+(n.cls||''),tabindex:0,role:'button','aria-label':n.title.join(' ')},gN);
    shapeFor(n,g,'halo'); shapeFor(n,g,'shape');
    const lines=[...n.title.map(t=>({t,c:'t',h:19})),...n.sub.map(t=>({t,c:'s'+(n.code?' code':''),h:16}))];
    let y=n.y-lines.reduce((a,l)=>a+l.h,0)/2+13;
    const subs=[];
    lines.forEach(l=>{const t=el('text',{class:l.c,x:n.x,y,'text-anchor':'middle'},g);t.textContent=l.t;if(l.c.startsWith('s'))subs.push(t);y+=l.h;});
    statusEls[n.id]=subs[subs.length-1];
    if(n.num){const b=el('g',{class:'badge'},g);el('circle',{cx:n.x-n.w/2+2,cy:n.y-n.h/2+2,r:13},b);el('text',{x:n.x-n.w/2+2,y:n.y-n.h/2+6.5,'text-anchor':'middle'},b).textContent=n.num;}
    const go=()=>goto(SEQ.findIndex(([s,i])=>s===sceneIdx&&i===n.step));
    g.addEventListener('click',go);
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter')go();});
    nodeEls[n.id]=g;
  });
}
function resetStatus(){ SC.nodes.forEach(n=>{ if(statusEls[n.id]) statusEls[n.id].textContent=n.sub[n.sub.length-1]; }); }

/* ===== Playback ===== */
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seqIdx=0, current=1, stepStart=performance.now(), playing=true, pausedAt=0, appliedStatus=-1;
const dotsEl=document.getElementById('dots');

function goto(idx){
  seqIdx=((idx%SEQ.length)+SEQ.length)%SEQ.length;
  const [s,i]=SEQ[seqIdx];
  if(s!==sceneIdx){
    buildScene(s);
    SCENES.forEach((_,k)=>document.getElementById('tab'+k).setAttribute('aria-selected',k===s));
    dotsEl.innerHTML=''; for(let k=1;k<=SC.steps;k++) dotsEl.appendChild(document.createElement('i'));
  }
  current=i; stepStart=performance.now(); pausedAt=0; appliedStatus=-1;
  if(!playing) pausedAt=0;
  resetStatus();
  const num=document.getElementById('capNum'), txt=document.getElementById('capTxt');
  num.textContent=current===0?'All':current; num.classList.toggle('all',current===0);
  txt.textContent=SC.captions[current]; txt.classList.remove('swap'); void txt.offsetWidth; txt.classList.add('swap');
  [...dotsEl.children].forEach((d,k)=>{d.className=k+1===current?'on':(current===0||k+1<current?'past':'');});
  render(0);
}

function render(sec){
  const all=current===0;
  edgeEls.forEach(o=>{
    const e=o.e; let s;
    if(all) s='is-active';
    else if(e.step===current) s = sec>=e.delay ? 'is-active' : 'is-todo';
    else s = e.step<current ? 'is-done' : 'is-todo';
    if(s==='is-active' && e.until && !all && sec>e.until) s='is-done';
    [o.g,o.lg].forEach(g=>{ if(!g) return; g.classList.remove('is-active','is-done','is-todo'); g.classList.add(s); });
    const col = s==='is-todo' ? 'ink' : e.cls==='evidence'?'amber':e.cls==='fail'?'red':e.cls==='pass'?'green':(s==='is-active'?'teal':'ink');
    o.path.setAttribute('marker-end',`url(#arr-${col})`);
    o.state=s; o.color=COLORS[col==='ink'?'teal':col];
  });
  SC.nodes.forEach(n=>{
    const g=nodeEls[n.id]; let s;
    if(all) s = SC.final.includes(n.id) ? 'is-active' : 'is-done';
    else if(n.step===current){
      let t=0;
      if(n.appear!=null) t=n.appear;
      else { const inc=SC.edges.filter(e=>e.to===n.id && e.step===current); if(inc.length) t=Math.min(...inc.map(e=>e.delay))+1; }
      s = sec>=t ? 'is-active' : 'is-todo';
    } else s = n.step<current ? 'is-done' : 'is-todo';
    g.classList.remove('is-active','is-done','is-todo'); g.classList.add(s);
    const fw=(SC.fails||[]).filter(f=>f.node===n.id);
    if(fw.length) g.classList.toggle('failing', fw.some(f=>current===f.step && sec>=f.from && sec<f.to));
    else if(SC.failWindow && n.id==='G') g.classList.toggle('failing', current===SC.failStep && sec>=SC.failWindow[0] && sec<SC.failWindow[1]);
  });
  SC.groups.forEach(gr=>{
    const g=groupEls[gr.id]; g.classList.remove('is-active','is-todo');
    if(all) return;
    if(gr.nodes.some(id=>nodeEls[id].classList.contains('is-active'))) g.classList.add('is-active');
    else if(gr.nodes.every(id=>SC.nodes.find(n=>n.id===id).step>current)) g.classList.add('is-todo');
  });
  const list=SC.status[current]||[];
  let idx=-1; list.forEach((s,k)=>{if(sec>=s[0]) idx=k;});
  if(idx!==appliedStatus){ resetStatus(); for(let k=0;k<=idx;k++) statusEls[list[k][1]].textContent=list[k][2]; appliedStatus=idx; }
  drawTokens(sec);
}

function drawTokens(sec){
  let used=0;
  if(!reduced){
    edgeEls.forEach(o=>{
      if(o.state!=='is-active') return;
      const travel=(sec-(current===0?0:o.e.delay))*TOKEN_SPEED, spacing=70;
      for(let d=travel%spacing; d<=Math.min(travel,o.len); d+=spacing){
        let c=tokenPool[used];
        if(!c){c=el('circle',{class:'token',r:4.5},tokenLayer);tokenPool.push(c);}
        const p=o.path.getPointAtLength(d);
        c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('fill',o.color);
        c.setAttribute('opacity',Math.max(0,Math.min(1,(o.len-d)/30,d/15+0.2)).toFixed(2)); c.style.display='';
        used++;
      }
    });
  }
  for(let k=used;k<tokenPool.length;k++) tokenPool[k].style.display='none';
}

function loop(now){
  if(playing){
    const sec=(now-stepStart)/1000;
    const dur=(current===0?OVERVIEW_MS:STEP_MS)/1000;
    if(sec>=dur) goto(seqIdx+1); else render(sec);
  }
  requestAnimationFrame(loop);
}

/* ===== Controls ===== */
const playBtn=document.getElementById('play');
function togglePlay(){
  playing=!playing;
  if(playing) stepStart=performance.now()-pausedAt*1000;
  else pausedAt=(performance.now()-stepStart)/1000;
  playBtn.textContent=playing?'❚❚':'▶'; playBtn.setAttribute('aria-label',playing?'Pause':'Play');
}
playBtn.addEventListener('click',togglePlay);
document.getElementById('next').addEventListener('click',()=>goto(seqIdx+1));
document.getElementById('prev').addEventListener('click',()=>goto(seqIdx-1));
SCENES.forEach((_,s)=>document.getElementById('tab'+s).addEventListener('click',()=>goto(SEQ.findIndex(([a,i])=>a===s&&i===1))));
document.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowRight'||ev.key==='PageDown') goto(seqIdx+1);
  else if(ev.key==='ArrowLeft'||ev.key==='PageUp') goto(seqIdx-1);
  else if(ev.key===' '){ev.preventDefault();togglePlay();}
  else if(/^[1-9]$/.test(ev.key) && +ev.key<=SCENES.length) goto(SEQ.findIndex(([a,i])=>a===+ev.key-1&&i===1));
  else if(ev.key==='f'||ev.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); }
});

goto(0); requestAnimationFrame(loop);
</script>
